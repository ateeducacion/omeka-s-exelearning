# eXeLearning module nginx configuration
# Route content proxy requests to PHP
location ^~ /exelearning/content/ {
    try_files $uri /index.php$is_args$args;
}

# Route admin-uploaded style asset requests to the PHP serve controller.
# Without this prefix location, the default static-files regex that
# catches .css/.js/.png in the Omeka nginx vhost short-circuits these
# URLs to the filesystem and 404s before they reach Laminas.
location ^~ /exelearning/styles/ {
    try_files $uri /index.php$is_args$args;
}

# SECURITY: Block direct access to extracted eXeLearning files
location ^~ /files/exelearning/ {
    return 403;
}

# SECURITY: Block direct access to the ephemeral editor-preview session store.
# PreviewController serves these bytes through an opaque-origin capability URL
# with a sandbox CSP. nginx does NOT read the store's Apache .htaccess deny
# guard, so without this rule a direct GET to a materialized preview document
# (files/exelearning-preview/{id}/rev/{n}/documents/*.html) would return
# untrusted author HTML SAME-ORIGIN and WITHOUT the sandbox CSP — a second,
# un-sandboxed serving path that defeats the opaque-origin isolation. The
# -preview/ prefix is NOT covered by the /files/exelearning/ rule above.
location ^~ /files/exelearning-preview/ {
    return 403;
}
