# eXeLearning security configuration for nginx
# Add this to your nginx server block or include it

# Block direct access to extracted eXeLearning content
# Forces all access through the secure proxy controller
location ^~ /files/exelearning/ {
    # Return 403 Forbidden for any direct access
    deny all;
    return 403;
}

# Block direct access to the ephemeral editor-preview session store.
# These bytes are only ever meant to be served through PreviewController's
# opaque-origin capability URL (with a sandbox CSP). nginx ignores the store's
# Apache .htaccess, and the -preview/ prefix is not covered by the rule above,
# so a direct GET would leak untrusted author HTML same-origin without the CSP.
location ^~ /files/exelearning-preview/ {
    deny all;
    return 403;
}

