---
name: Architecture records

# Deliberately unfiltered.
#
# ci.yml skips '**.md' and 'docs/**', so an ADR-only pull request would run no
# job at all -- exactly the pull request this validator exists to police. And a
# code-only pull request can break the records too, by leaving a retired
# identifier in a comment, so filtering this workflow the other way would be
# just as wrong. It runs on everything instead; it is a few seconds of PHP with
# no dependency install.
on:
  pull_request:
  push:
    tags:
      - '*'
    branches:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  architecture_records:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      # No `composer install`: the validator has no dependencies, so the check
      # stays fast and keeps working in a checkout without vendor/.
      - name: Architecture validator matches core
        run: |
          # The validator is a verbatim copy of the canonical file in
          # exelearning/exelearning. Fix it there and re-copy — never edit it
          # here, or the copies drift apart silently.
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/exelearning/exelearning/main/scripts/architecture-records.mts \
            -o /tmp/architecture-records.core.mts
          if ! diff -u /tmp/architecture-records.core.mts scripts/architecture-records.mts; then
            echo "::error file=scripts/architecture-records.mts::drifted from exelearning/exelearning@main."
            echo "Re-copy it from core; do not patch it here."
            exit 1
          fi
          echo "In sync with core ($(shasum -a 256 scripts/architecture-records.mts | cut -c1-16)…)."

      - name: Validate architecture records
        run: make architecture-check

      - name: Record index
        if: always()
        run: |
          echo '## Architecture records' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          make architecture-records >> $GITHUB_STEP_SUMMARY
