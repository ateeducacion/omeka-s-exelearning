---
name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/*.md'
  push:
    tags:
      - '*'
    branches:
      - '*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/*.md'

# Cancel previous runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, curl, dom, json, pdo, mysql, xml, zip
          tools: composer:v2
          coverage: xdebug

      # === CACHING ===
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install gettext
        run: sudo apt-get install -y gettext

      # === LINT ===
      - name: Check untranslated strings
        run: make check-untranslated

      - name: Generate .mo file
        run: make compile-mo

      - name: Verify the vendored external-media artifact
        # eXeLearning core is canonical (eXe ADR-0021): this repo holds the BYTES and
        # verifies them against the manifest core published, rather than a copy of the
        # logic that could drift. --build-hash makes it a PROVENANCE check and not merely
        # an integrity one: without it a locally rebuilt-and-resigned copy would pass.
        #
        # If this fails, a vendored file was edited here. Fix it in eXeLearning core and
        # re-vendor; a local patch is invisible upstream and is overwritten next time.
        run: |
          # The expected hash is PINNED HERE, deliberately, and not read from the vendored
          # manifest. A hash taken from the copy under test cannot say anything about that
          # copy: file, digest and buildHash can all be rewritten together, and a check that
          # trusted them would pass a consistent forgery. This line is the out-of-band half.
          # Bump it in the same commit that re-vendors the artifact.
          node asset/js/exe_external_media/verify.mjs asset/js/exe_external_media --build-hash "43c776daa551fd770b6dade520629362e5a8ca8745e4245c359447c4689b34d6"

      - name: Run code linting
        run: make lint

      # === TESTS ===
      - name: Run unit tests with coverage
        run: make test-coverage
