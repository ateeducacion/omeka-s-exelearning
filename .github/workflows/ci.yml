---
name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/*.md'
  push:
    tags:
      - '*'
    branches:
      - '*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/*.md'

# Cancel previous runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Codecov authenticates with OIDC instead of a token kept as a secret.
  # Without this permission no identity token can be issued, and uploads from
  # a protected branch are rejected.
  id-token: write

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, curl, dom, json, pdo, mysql, xml, zip
          tools: composer:v2
          coverage: xdebug

      # === CACHING ===
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('composer.json') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install gettext
        run: sudo apt-get install -y gettext

      # === LINT ===
      - name: Check untranslated strings
        run: make check-untranslated

      - name: Generate .mo file
        run: make compile-mo

      - name: Verify the vendored external-media artifact
        # eXeLearning core is canonical (exelearning/exelearning ADR-2199-12): this repo
        # holds the BYTES and verifies them against the manifest core published, rather
        # than a copy of the logic that could drift. --build-hash makes it a PROVENANCE
        # check and not merely an integrity one: without it a locally rebuilt-and-resigned
        # copy would pass.
        #
        # If this fails, a vendored file was edited here. Fix it in eXeLearning core and
        # re-vendor; a local patch is invisible upstream and is overwritten next time.
        run: |
          # The expected hash is PINNED HERE, deliberately, and not read from the vendored
          # manifest. A hash taken from the copy under test cannot say anything about that
          # copy: file, digest and buildHash can all be rewritten together, and a check that
          # trusted them would pass a consistent forgery. This line is the out-of-band half.
          # Bump it in the same commit that re-vendors the artifact.
          node asset/js/exe_external_media/verify.mjs asset/js/exe_external_media --build-hash "43c776daa551fd770b6dade520629362e5a8ca8745e4245c359447c4689b34d6"

      - name: Run code linting
        run: make lint

      # === TESTS ===
      # Fails on a failing test as well as on coverage below MIN_COVERAGE.
      # Both gates live in the Make target so a laptop and CI agree.
      - name: Run unit tests with coverage
        run: make test-coverage

      - name: Add coverage to job summary
        if: always()
        run: |
          echo "## 📊 Code Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f artifacts/coverage/coverage.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "^\s*(Classes|Methods|Lines):" artifacts/coverage/coverage.txt >> $GITHUB_STEP_SUMMARY \
              || echo "No coverage data" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Coverage report not generated" >> $GITHUB_STEP_SUMMARY
          fi

      # === COVERAGE PUBLISHING ===
      # OIDC, not a token: no CODECOV_TOKEN secret is configured, and uploads
      # from the protected main branch are rejected without credentials.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: always()
        with:
          use_oidc: true
          files: artifacts/coverage/clover.xml
          flags: php
          # Without this the uploader also sweeps up coverage.txt, a
          # human-readable summary it cannot parse as a coverage report.
          disable_search: true

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: artifacts/coverage/html/
          retention-days: 30
